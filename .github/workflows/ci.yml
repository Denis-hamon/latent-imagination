name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Test (smoke + guards)
        run: uv run pytest -q

  replay-check:
    # Story 1.11 AC3: prove a replay bundle recomputes on a clean host, not on
    # the developer's machine. Runs the harness replay suite only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync workspace (all members)
        run: uv sync --locked --all-packages
      - name: Replay a bundle on this clean runner
        run: uv run pytest packages/harness/tests/test_replay.py -q
