[project]
name = "li-probe"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — probe (skeleton, Story 1.1)"
dependencies = ["li-core-schema"]
[project.optional-dependencies]
# Populated at Epic 3/4 — Replay-Tier-1 must install with zero ML deps (AD-11).
ml = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "probe"
