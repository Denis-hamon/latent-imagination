[project]
name = "li-harbor-runner"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — harbor runner (skeleton, Story 1.1)"
dependencies = ["li-core-schema"]

# edge package: network deps allowed (AD-1/AD-6)

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "harbor_runner"
