[project]
name = "li-ots-anchor"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — OTS anchor adapter (edge; the only prereg-family network hop)"
dependencies = ["opentimestamps-client==0.7.2", "li-prereg"]

# edge package: network deps allowed (AD-1/AD-6)

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-prereg = { workspace = true }

[tool.uv.build-backend]
module-name = "ots_anchor"
