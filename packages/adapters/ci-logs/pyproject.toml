[project]
name = "li-ci-logs"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — ci logs (skeleton, Story 1.1)"
dependencies = ["httpx==0.28.1", "li-core-schema", "pydantic-settings==2.14.2"]

# edge package: network deps allowed (AD-1/AD-6)

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "ci_logs"
