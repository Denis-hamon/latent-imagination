[project]
name = "li-hf-hub"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — HF Hub mirror (edge, story 2.6-task-4 close)"
dependencies = ["huggingface_hub==1.26.1", "li-core-schema"]

# edge package: network deps allowed (AD-1/AD-6)

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "hf_hub_push"
