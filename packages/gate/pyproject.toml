[project]
name = "li-gate"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — advisory gate (Story 5.1)"
dependencies = ["li-core-schema"]


[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "gate"
