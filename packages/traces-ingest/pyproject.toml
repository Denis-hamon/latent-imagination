[project]
name = "li-traces-ingest"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — traces ingest (skeleton, Story 1.1)"
dependencies = ["li-core-schema", "li-store"]


[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }
li-store = { workspace = true }

[tool.uv.build-backend]
module-name = "traces_ingest"
