[project]
name = "li-corpus"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — corpus (Story 4.1: noisy-tier harvest core)"
dependencies = [
    "li-core-schema",
    "li-store",
    "li-traces-ingest",
    "li-probe",
    "pydantic",
    "pyarrow==25.0.0",
]
[project.optional-dependencies]
# Populated at Epic 3/4 — Replay-Tier-1 must install with zero ML deps (AD-11).
ml = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }
li-store = { workspace = true }
li-traces-ingest = { workspace = true }
li-probe = { workspace = true }

[tool.uv.build-backend]
module-name = "corpus"
