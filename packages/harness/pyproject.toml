[project]
name = "li-harness"
version = "0.1.0"
requires-python = ">=3.14"
description = "Latent Imagination — harness (skeleton, Story 1.1)"
dependencies = ["li-core-schema"]


[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
li-core-schema = { workspace = true }

[tool.uv.build-backend]
module-name = "harness"
