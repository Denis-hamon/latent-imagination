[project]
name = "latent-imagination"
version = "0.1.0"
requires-python = ">=3.14"
description = "Patch-consequence prediction for coding agents, in representation space."
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*"]
exclude = ["packages/adapters"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
