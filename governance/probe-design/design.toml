# Probe DESIGN — data, encoding, budgets. Anchored alongside decision.toml.

[data_basis]
choice = "clean-slice-only"
note = "FR-11: exactly ONE basis, pre-registered once, never varied per arm. The noisy-augmented path stays OUT for this arbitration; flipping it pulls a mini-noisy slice into MVP scope and would be recorded as an amendment."

[encoding] # OQ-2 resolved
what_the_encoder_sees = "rendered patch diff + task statement + failed-test tail"
alternatives_rejected = "full repo slice (budget), test-file embeddings (leakage at flip prediction)"

[arms]
per_arm_rule = "verdict computed per JEPA arm; best JEPA arm reported alongside the baseline"
baseline = "logistic regression on frozen embeddings (sklearn; class_weight=balanced; fixed seed)"
jepa_arms = ["jepa-main"]

[hyperparameter_envelopes]
baseline = "C in {0.1, 1, 10}; max_iter fixed 2000; lbfgs; seed fixed"
jepa = "lr in {1e-4, 1e-3}; epochs: train to the registered steps cap (20000); batch 64; dropout 0.1"
budgets = "baseline: wall <= 30min CPU / steps <= 5k; jepa: wall <= 2h on the node / steps <= 20k"

# AMENDMENT 2026-08-05 (pre-verdict): the sealed pool {batch 128, epochs <= 10}
# undertrained by ~300x on a 345-sample corpus (≈27 steps). Made visible by a
# degenerate never-predicts-positive run (loss flat, precision=0.0 measured AND
# recorded, not discarded). The step cap (20000) was already the real budget —
# epochs bound is now written to match it. hidden/batch values replaced by the
# actual ones (512/64) used in runs R1/R2, also recorded.

[eval_split] # AMENDMENT 2026-08-05 (post-seal, pre-training): split rule made explicit
# Initial rule (repo-shuffle with seed) produced a 3-item eval set on this 11-repo slice —
# unusable for CIs. Changing rule now, on the record, BEFORE any training:
rule = "repo-grouped + size-stratified: sort repos by item count desc, take every k-th repo (k = ceil(n_repos / target_eval_repos)) so eval covers ~20% of ITEMS with ≥2 mid-size repos; seed-independent"
target_eval_repos = 2
target_eval_item_share = 0.2
reason = "n_eval=3 on repo-shuffle seed 20260805; accounting must happen before outcomes are seen — this file is that accounting."

[negatives_class] # AMENDMENT 2026-08-05 (post-seal, pre-training): the seal
# named only the positive class (gold patches flip). The arbitration needs a REAL
# negative class: agent attempt patches that did NOT flip the F2P tests, from
# public SWE-bench experiment runs (real trajectories, real failures).
source = "SWE-bench/SWE-smith-trajectories (MIT, public): per-trajectory `patch` + `resolved` flag, real agent attempts on real OSS repos; joined to SWE-smith task metadata for problem statements"
rule = "positives: gold patch of each kept Verified instance (quality floor); negatives: real agent patches with resolved=false; both flow through the SAME features.py renderer and the SAME repo-grouped split. Instance sets are disjoint by corpus (never same instance on both sides); leakage control = repo grouping."
why_now = "caught at baseline-arm test time (toy separation passed but real data has no negatives); amending on the record, before any model is trained. SWE-smith's synthetic task synthesis is a caveated population and we say so in the verdict doc."
